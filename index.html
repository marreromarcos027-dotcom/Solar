<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Solar Fotovoltaica</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .producto { border: 1px solid #ccc; padding: 10px; margin: 10px; display: inline-block; }
    .carrito { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Tienda Solar Fotovoltaica</h1>
  <h2>Catálogo de productos</h2>

  <div id="catalogo">
    <div class="producto">
      <p>Panel solar 550W</p>
      <p>Precio: $300</p>
      <button onclick="agregarCarrito('Panel solar 550W',300)">Agregar</button>
    </div>
    <div class="producto">
      <p>Inversor híbrido 5kW</p>
      <p>Precio: $600</p>
      <button onclick="agregarCarrito('Inversor híbrido 5kW',600)">Agregar</button>
    </div>
    <div class="producto">
      <p>Batería 51.2V 100Ah</p>
      <p>Precio: $800</p>
      <button onclick="agregarCarrito('Batería 51.2V 100Ah',800)">Agregar</button>
    </div>
  </div>

  <div class="carrito">
    <h2>Carrito de compras</h2>
    <ul id="listaCarrito"></ul>
    <p>Total: $<span id="total">0</span></p>
  </div>

  <h2>Datos del cliente</h2>
  <form id="clienteForm">
    <input type="text" id="nombre" placeholder="Nombre completo" required><br>
    <input type="text" id="ci" placeholder="Carnet de identidad" required><br>
    <input type="tel" id="telefono" placeholder="Teléfono" required><br>
    <input type="text" id="direccion" placeholder="Dirección" required><br>
    <select id="entrega">
      <option value="Entrega a domicilio">Entrega a domicilio</option>
      <option value="Recogida en tienda">Recogida en tienda</option>
    </select><br><br>
    <button type="button" onclick="generarPDF()">Generar Prefactura PDF</button>
  </form>

  <script>
    let carrito = [];
    let total = 0;

    function agregarCarrito(producto, precio) {
      carrito.push({producto, precio});
      total += precio;
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const lista = document.getElementById("listaCarrito");
      lista.innerHTML = "";
      carrito.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.producto} - $${item.precio}`;
        lista.appendChild(li);
      });
      document.getElementById("total").textContent = total;
    }

    function generarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const nombre = document.getElementById("nombre").value;
      const ci = document.getElementById("ci").value;
      const telefono = document.getElementById("telefono").value;
      const direccion = document.getElementById("direccion").value;
      const entrega = document.getElementById("entrega").value;

      doc.text("Prefactura - Tienda Solar", 10, 10);
      doc.text(`Nombre: ${nombre}`, 10, 20);
      doc.text(`CI: ${ci}`, 10, 30);
      doc.text(`Teléfono: ${telefono}`, 10, 40);
      doc.text(`Dirección: ${direccion}`, 10, 50);
      doc.text(`Opción: ${entrega}`, 10, 60);
      doc.text("Productos:", 10, 70);

      let y = 80;
      carrito.forEach(item => {
        doc.text(`- ${item.producto} $${item.precio}`, 10, y);
        y += 10;
      });

      doc.text(`Total: $${total}`, 10, y + 10);

      // Guardar PDF
      doc.save("prefactura.pdf");

      // Enviar por WhatsApp (mensaje con enlace)
      const mensaje = `Hola ${nombre}, su prefactura está lista. Total: $${total}`;
      const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
